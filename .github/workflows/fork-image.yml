# Fork-only image build for the dropitx gateway (Dokploy/Rancher host cannot
# build from source — OOM). Builds the same runner-base target as the official
# diegosouzapw/omniroute:latest image, for the host's arch only, and pushes to
# this fork's GHCR. Never runs upstream — see docker-publish.yml there.
name: fork-image

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/glm-5.3-image

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runner-base image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/omniroute:glm-5.3
          cache-from: type=gha,scope=fork-image
          cache-to: type=gha,scope=fork-image,mode=max
